name: ERCC reference and two-method quantification tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade setuptools wheel
      - run: python -m pip install --no-build-isolation '.[bam]'
      - run: python -m unittest discover -s tests -v

      - run: |
          ercc-audit --version
          ercc-audit fit-ercc --samples examples/simulated/samples.tsv --standards examples/simulated/standards.tsv --observations examples/simulated/observations.tsv --outdir results-ci
      - run: |
          hybcapseq_quant --version
          python examples/quant/generate_demo.py
          hybcapseq_quant --samples examples/quant/samples.tsv --esviritu-dir examples/quant --outdir quant-ci
