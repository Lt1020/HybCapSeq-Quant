name: Quantification verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade setuptools wheel
      - run: python -m pip install --no-build-isolation '.[bam,dev]'
      - run: python -m black --check src/hybcapseq_quant tests examples/quant/generate_demo.py
      - run: python -m unittest discover -s tests -v
      - name: Verify installed command and analytical example
        run: |
          hybcapseq_quant --version
          python examples/quant/generate_demo.py
          hybcapseq_quant run --samples examples/quant/samples.tsv --esviritu-dir examples/quant --outdir quantification_output
      - uses: actions/upload-artifact@v4
        with:
          name: analytical-example-python-${{ matrix.python-version }}
          path: quantification_output/
