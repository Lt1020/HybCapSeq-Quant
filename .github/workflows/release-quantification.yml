name: Publish quantification release

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'src/hybcapseq_quant/**'
      - 'docs/RELEASE_NOTES_2.1.0.md'
      - '.github/workflows/release-quantification.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantification-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and install distribution
        run: |
          python -m pip install --upgrade build setuptools wheel
          python -m build
          python -m pip install dist/*.whl
      - name: Verify installed software
        run: |
          hybcapseq_quant --version
          python -m unittest discover -s tests -v
      - name: Package reference update
        run: |
          python scripts/database/package_reference_update.py --output-dir dist
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('dist')
          files = sorted(p for p in root.iterdir() if p.is_file() and p.name != 'SHA256SUMS.txt')
          (root / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          PY
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          quant_version=$(python -c 'from hybcapseq_quant import __version__; print(__version__)')
          quant_tag="v$quant_version"
          if gh release view "$quant_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            quant_existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$quant_tag" --jq '.sha')
            if [ "$quant_existing" != "$GITHUB_SHA" ]; then
              echo "Release tag already points to another commit; refusing to replace it."
              exit 1
            fi
            exit 0
          fi
          gh release create "$quant_tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "HybCapSeq-Quant $quant_version and reference database v3.3.1" --notes-file "docs/RELEASE_NOTES_$quant_version.md"
