name: Publish EsViritu database v3.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-database-v3.4.yml'
      - 'databases/v3.4/build_config.json'
      - 'databases/v3.4/esviritu_db_v3.4_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-v3.4-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install and test quantification software
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
      - name: Download checksum-pinned base database and minimap2
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/esviritu-v3.4"
          mkdir -p "$build_dir/sources"
          curl --fail --location --retry 3 --output "$build_dir/sources/base.tar.gz" https://github.com/Lt1020/HybCapSeq-Quant/releases/download/db-v3.3/esviritu_db_v3.3.tar.gz
          printf '86e3f472b5376bb75c0baac29f460f3e13f4766f091659107c17e04451198e2c  %s\n' "$build_dir/sources/base.tar.gz" | sha256sum -c -
          curl --fail --location --retry 3 --output "$build_dir/sources/minimap2.tar.bz2" https://github.com/lh3/minimap2/releases/download/v2.31/minimap2-2.31_x64-linux.tar.bz2
          printf '300bc287f05eb890c6211fa7db043ce98320a401621fadd1cfdbeabd1a6e4ab5  %s\n' "$build_dir/sources/minimap2.tar.bz2" | sha256sum -c -
          python - <<'PY'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'esviritu-v3.4'
          for name in ['base.tar.gz', 'minimap2.tar.bz2']:
              with tarfile.open(root / 'sources' / name) as archive:
                  archive.extractall(root, filter='data')
          PY
      - name: Build and verify all 31,024 references against locked hashes
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/esviritu-v3.4"
          python scripts/database/build_v3_4.py \
            --base-dir "$build_dir/v3.3" --reference-package references/pcr_roi \
            --output-dir "$build_dir/v3.4" --work-dir "$build_dir/build" \
            --minimap2 "$build_dir/minimap2-2.31_x64-linux/minimap2" \
            --expected-manifest databases/v3.4/esviritu_db_v3.4_manifest.json
          hybcapseq_quant validate-db --db-dir "$build_dir/v3.4"
          python scripts/database/verify_v3_4_quantification.py --db-dir "$build_dir/v3.4" --output-dir "$build_dir/simulated-check"
      - name: Package database and verify archive round trip
        run: |
          python scripts/database/package_v3_4.py \
            --database-dir "$RUNNER_TEMP/esviritu-v3.4/v3.4" \
            --output-dir "$RUNNER_TEMP/esviritu-v3.4/release"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/database/publish_v3_4.py \
            --assets "$RUNNER_TEMP/esviritu-v3.4/release" \
            --notes databases/v3.4/release_notes.md
